name = "mf"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Mf"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "MathFin"
git = "https://github.com/raphaelrrcoelho/formal-mathfin.git"
rev = "1df87ce9b7b7dfbfc57424cef8cce6cf21d9b12c"

[[require]]
name = "BrownianMotion"
git = "https://github.com/RemyDegenne/brownian-motion.git"
rev = "d94b0c1786e84d6e921d6cda18ea691bea17103c"

[[require]]
name = "kolmogorov_extension4"
git = "https://github.com/RemyDegenne/kolmogorov_extension4.git"
rev = "7d76e184c3d2138a2741baf923b57e9a01b9cf25"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "Mf"

