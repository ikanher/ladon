[project]
name = "ladon"
version = "0.1.0"
description = "Lean-oriented code-quality, proof-graph, witness, and review-packet analyzer"
readme = "README.md"
authors = [
    { name = "Aki Rehn", email = "aki.rehn@helsinki.fi" }
]
requires-python = ">=3.11,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
ladon = "ladon.entrypoint:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.25.1",
    "pytest>=9.0.3",
    "radon>=6.0.1",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".codex", "temp", "tests/fixtures"]
