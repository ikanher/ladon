[workspace]
resolver = "2"
members = [
    "proofir-core",
    "proofir-json",
    "proofir-validate",
    "proofir-sqlite",
    "proofir-lean-client",
    "proofir-ladon",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde_json = "1.0"
sha2 = "0.10"
libsqlite3-sys = "0.37"
